server:
  port: 8080  # El puerto único para el Frontend

jwt:
  secret: WriteHereYourSecretStringForTokenSigningCredentials

gateway:
  public-paths:
    - /api/v1/users/signup
    - /api/v1/users/signin
    - /api/v1/users/available-roles
    - /v3/api-docs
    - /swagger-ui
    - /swagger-ui.html
    - /swagger-resources
    - /webjars
    - /error
    - /actuator

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Rutas hacia el microservicio de IAM
        - id: iam-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/users/**

        # Rutas hacia el microservicio de IAM (farm tokens) (DENTRO DE IAM CONTEXT)
        - id: iam-service-farm-tokens
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/iam/**

        # Rutas hacia el microservicio de Equipment
        - id: equipment-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/farms/**, /api/v1/ponds/**, /api/v1/equipment/**

        # Rutas hacia el microservicio de Notification
        - id: notification-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/users/*/notifications/**, /api/v1/users/*/device-tokens/**, /api/v1/webhooks/notifications/**

        # Rutas hacia el microservicio de Subscription
        - id: subscription-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/subscriptions/**, /api/v1/plans/**, /api/v1/payments/**, /api/v1/webhooks/stripe/**
